# ─── Default configuration ───
[COMPILER]
ARCH = arm
CPU = cortex-a9
CROSS = arm-none-eabi

[FEATURES]
ENABLE_SECURE_BOOT = yes
ENABLE_SIGNATURE = yes
ENABLE_ROLLBACK_PROTECT = yes
ENABLE_RECOVERY = yes
ENABLE_WATCHDOG = yes
ENABLE_POST = yes

[SIZES]
BOOTLOADER_SIZE = 256K
STACK_SIZE = 32K
HEAP_SIZE = 16K

[HARDWARE]
UART_BAUDRATE = 115200
WATCHDOG_TIMEOUT = 30000
DRAM_SIZE = 2G
